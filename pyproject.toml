[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "liftproof"
dynamic = ["version"]
description = "Liftproof: migration validation for workloads moving to AWS"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Algorims" }]
dependencies = [
  "boto3>=1.34",
  "jinja2>=3.1.4",
  "playwright>=1.47",
  "psycopg[binary]>=3.2",
  "pypdf>=5",
  # rsa: caching_sha2_password logins without TLS. Below 1.2: 1.2.3 fails the full
  # caching_sha2_password exchange (AttributeError in _request_authentication).
  "pymysql[rsa]>=1.1.1,<1.2",
  # thin mode: no Oracle client libraries on the image
  "oracledb>=2.5,<27",
  # pure Python TDS: no ODBC driver on the image; pyOpenSSL is its TLS layer
  "python-tds>=1.16,<1.18",
  "pyopenssl>=24",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pip-audit>=2.7", "moto[s3]>=5"]

[project.scripts]
liftproof = "liftproof.cli:main"
mvt = "liftproof.cli:main"

[tool.hatch.version]
path = "src/liftproof/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/liftproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not perf'"
markers = [
  "postgres: needs a PostgreSQL server (LIFTPROOF_TEST_PG_HOST)",
  "browser: needs Chromium for Playwright (or LIFTPROOF_CHROMIUM)",
  "mysql: needs a MySQL server (LIFTPROOF_TEST_MYSQL_HOST)",
  "oracle: needs an Oracle server (LIFTPROOF_TEST_ORACLE_HOST)",
  "sqlserver: needs a SQL Server (LIFTPROOF_TEST_MSSQL_HOST)",
  "perf: the KPI performance suite (PRD N8, N9); run with -m perf",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608"]  # asserts in tests; SQL is built from quoted identifiers only

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
