name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-local-service
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-local-service
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-only-local-service"
          --health-interval 5s --health-timeout 5s --health-retries 20
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: ci-only-local-service
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s --health-timeout 5s --health-retries 30
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci-only-local-service1
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci-only-local-service1 -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      LIFTPROOF_TEST_PG_HOST: localhost
      LIFTPROOF_TEST_PG_PORT: "5432"
      LIFTPROOF_TEST_PG_USER: postgres
      LIFTPROOF_TEST_PG_PASSWORD: ci-only-local-service
      LIFTPROOF_TEST_MYSQL_HOST: 127.0.0.1
      LIFTPROOF_TEST_MYSQL_PORT: "3306"
      LIFTPROOF_TEST_MYSQL_USER: root
      LIFTPROOF_TEST_MYSQL_PASSWORD: ci-only-local-service
      LIFTPROOF_TEST_ORACLE_HOST: 127.0.0.1
      LIFTPROOF_TEST_ORACLE_PORT: "1521"
      LIFTPROOF_TEST_ORACLE_SERVICE: FREEPDB1
      LIFTPROOF_TEST_ORACLE_USER: system
      LIFTPROOF_TEST_ORACLE_PASSWORD: ci-only-local-service
      LIFTPROOF_TEST_MSSQL_HOST: 127.0.0.1
      LIFTPROOF_TEST_MSSQL_PORT: "1433"
      LIFTPROOF_TEST_MSSQL_USER: sa
      LIFTPROOF_TEST_MSSQL_PASSWORD: Ci-only-local-service1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src
      - name: Functional tests (OPE-004). A red suite blocks merge and release.
        run: pytest -q
      - name: Record SDK versions in the build output (AWSAPI-004)
        run: liftproof version --format json | tee build-versions.json
      - uses: actions/upload-artifact@v4
        with:
          name: build-versions
          path: build-versions.json

  vulnerability-scan:
    # ATS-009: a known vulnerability blocks the build; keep these logs as evidence.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - name: Dependency audit (fails the job on any known vulnerability)
        run: pip-audit --strict --desc on --progress-spinner off . 2>&1 | tee pip-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-scan-${{ github.sha }}
          path: pip-audit.log
          retention-days: 400
